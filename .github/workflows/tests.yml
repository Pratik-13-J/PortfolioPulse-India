name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # Windows matches the verified local deployment target. Tests use synthetic
    # fixtures and temporary databases only: no API keys, no market data, and
    # the git-ignored data/portfoliopulse.db is never present in CI.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run the full test suite
        run: python -m pytest -q -p no:cacheprovider
